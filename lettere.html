<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Per Te</title>
    <style>
        :root {
            --bg-color: #0f0c1b;
            --accent-pink: #ff7597;
            --envelope-bg: #ffffff;
            --envelope-inside: #fbe3e8;
            --text-color: #2b2b2b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #0f0c20 0%, #150a18 50%, #241026 100%);
            color: #fbe3e8;
            font-family: 'Georgia', serif;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 30px 15px; /* Margini leggermente ridotti per i bordi mobile */
        }

        #canvas-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            padding-bottom: 40px;
            animation: fadeIn 2s ease-in-out;
        }

        header h1 {
            font-size: 2.2rem; /* Scalato per mobile */
            font-weight: 300;
            letter-spacing: 2px;
            color: var(--accent-pink);
            text-shadow: 0 0 15px rgba(255, 117, 151, 0.4);
            margin-bottom: 12px;
        }

        header p {
            font-style: italic;
            color: rgba(251, 227, 232, 0.7);
            font-size: 1rem;
            padding: 0 10px;
        }

        .letters-grid {
            display: grid;
            /* Layout flessibile: si adatta nativamente da schermi piccolissimi a desktop */
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 50px 20px;
            justify-items: center;
            padding-top: 10px;
        }

        /* --- CONTENITORE BUSTA --- */
        .envelope-wrapper {
            position: relative;
            width: 200px; /* Arrotondato per centrare meglio sui display stretti */
            height: 130px;
            background-color: var(--envelope-inside);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            border-bottom-left-radius: 6px;
            border-bottom-right-radius: 6px;
            transition: transform 0.3s;
            overflow: hidden; 
        }

        .envelope-wrapper:hover {
            transform: translateY(-5px);
        }

        .envelope-wrapper.open {
            overflow: visible;
        }

        /* Corpo frontale della busta */
        .envelope {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        .envelope::before {
            content: "";
            position: absolute;
            top: 0;
            z-index: 2;
            border-left: 100px solid transparent;
            border-right: 100px solid transparent;
            border-top: 65px solid transparent;
            border-bottom: 65px solid var(--envelope-bg);
        }

        .envelope::after {
            content: "";
            position: absolute;
            top: 0;
            z-index: 2;
            border-left: 100px solid var(--envelope-bg);
            border-right: 100px solid transparent;
            border-top: 65px solid transparent;
            border-bottom: 65px solid transparent;
            opacity: 0.95;
        }

        /* Lembo superiore */
        .flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 100px solid transparent;
            border-right: 100px solid transparent;
            border-top: 70px solid var(--envelope-bg);
            border-bottom: 70px solid transparent;
            transform-origin: top;
            transition: transform 0.4s ease, z-index 0.2s;
            z-index: 4;
        }

        /* Cuore/Sigillo */
        .heart-seal {
            position: absolute;
            top: 55px;
            left: 50%;
            transform: translateX(-50%);
            width: 22px;
            height: 22px;
            background-color: var(--accent-pink);
            z-index: 5;
            clip-path: path('M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z');
            transition: opacity 0.3s ease;
        }

        /* Data esterna sotto la busta */
        .envelope-label {
            position: absolute;
            bottom: -30px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 0.85rem;
            color: rgba(251, 227, 232, 0.6);
            letter-spacing: 1px;
            font-family: sans-serif;
            transition: color 0.3s;
            z-index: 6;
        }

        .envelope-wrapper:hover .envelope-label {
            color: var(--accent-pink);
        }

        /* --- FOGLIETTO INTERNO --- */
        .letter-preview-card {
            position: absolute;
            bottom: 0;
            left: 12px;
            right: 12px;
            height: 70px;
            background-color: #fff;
            border-radius: 4px;
            padding: 10px 6px;
            z-index: 1;
            transition: transform 0.4s ease;
            opacity: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .letter-preview-card h4 {
            color: var(--accent-pink);
            font-size: 0.8rem;
            font-weight: bold;
            line-height: 1.2;
            word-wrap: break-word;
            max-width: 100%;
        }

        /* --- EFFETTI DI APERTURA --- */
        .envelope-wrapper.open .flap {
            transform: rotateX(180deg);
            z-index: 0;
        }

        .envelope-wrapper.open .heart-seal {
            opacity: 0;
        }

        .envelope-wrapper.open .letter-preview-card {
            transform: translateY(-60px);
            z-index: 2;
            opacity: 1;
        }

        /* --- SCHERMO LETTERA APERTA (MODAL RESPONSIVE) --- */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 5, 15, 0.92);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            padding: 12px;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #fffdf9;
            color: var(--text-color);
            width: 95%; /* Più largo su mobile rispetto a prima per non stringere il testo */
            max-width: 580px;
            max-height: 85vh; 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; /* Rende lo scroll fluidissimo su iPhone/iOS */
            border-radius: 8px;
            padding: 40px 25px 35px 25px; /* Spazio interno bilanciato */
            box-shadow: 0 15px 45px rgba(0,0,0,0.6), inset 0 0 30px rgba(0,0,0,0.03);
            transform: translateY(30px) scale(0.97);
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
            border: 1px solid #eae5d8;
        }

        .modal.active .modal-content {
            transform: translateY(0) scale(1);
        }

        .modal-close {
            position: absolute;
            top: 12px;
            right: 18px;
            font-size: 2.2rem; /* Più grande per essere cliccato comodamente da touch */
            color: #bbb;
            cursor: pointer;
            transition: color 0.2s;
            z-index: 12;
            line-height: 1;
        }

        .modal-close:hover {
            color: var(--accent-pink);
        }

        .modal-date {
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 10px;
            font-style: italic;
            font-family: sans-serif;
        }

        .modal-title {
            font-size: 1.7rem; /* Scalato per mobile */
            margin-bottom: 20px;
            font-weight: 400;
            color: #1a1a1a;
            line-height: 1.3;
            padding-right: 20px; /* Evita sovrapposizione con la X */
        }

        .modal-body {
            font-size: 1.05rem; /* Ottimizzato per la lettura da smartphone */
            line-height: 1.8;
            color: #333;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Scrollbar sottile ma visibile */
        .modal-content::-webkit-scrollbar {
            width: 4px;
        }
        .modal-content::-webkit-scrollbar-track {
            background: transparent;
        }
        .modal-content::-webkit-scrollbar-thumb {
            background: rgba(255, 117, 151, 0.4);
            border-radius: 4px;
        }

        /* Ottimizzazioni per schermi medi/grandi (Tablet e Desktop) */
        @media (min-width: 600px) {
            body { padding: 40px 20px; }
            header h1 { font-size: 3rem; }
            header p { font-size: 1.1rem; }
            .letters-grid { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 60px 30px; }
            .modal-content { padding: 50px 40px; }
            .modal-title { font-size: 2.2rem; }
            .modal-body { font-size: 1.15rem; }
        }
    </style>
</head>

            },

n te per il resto della vita legati insieme.\n\nPuò sembrare un pò sbagliata la scelta che ho fatto di importarmi solo di te e di nessun altro ma sono sicuro di aver fatto la scelta giusta perchè sei la persona giusta ed hai un cuore enorme.\n\nNon devi ascoltare le cose che pensano gli altri stronzi del gruppo perchè tu sei una persona matura e forte, cosa che gli altri stupidi non sanno, perchè credono di essere grandi quando invece non lo sono.\n\nSei l'unica persona che tiene a me e me lo hai dimostrato facendo tantissime cose che nessuno ha mai fatto, non mi aspettavo di riuscire ad avere una amica che mi facesse il tiramisù e sopratutto bene (sei bravissima a farlo).\n\nNon mi aspettavo nemmeno che trovassi una amica che mi facesse conoscere i parenti (adoro tua madre).\n\nNon ci posso credere che stai facendo un altro tiramisù per me, SEI TROPPO GENTILE E CARINAAAAAAA.\n\nSEI DAVVERO Buona, Bella, Brava, Vera, Dolce, Cara, Allegra, Forte, Felice, Paziente, Aperta, Gentile, Calma, Onesta, Fedele, Simpatica, Attenta, Unica, Sicura, Pronta, Viva, Curiosa, Libera, Attiva, Dolce, Semplice, Preziosa  E LO DEVI SAPERE BENE.\n\nSono le 22:50 del 05/03/2026 e credo che ti sei addormentata o che ti stai per addormentare in chiamata, sei carinissima e non vorrei svegliarti. Ore 22:56 ti sei appena svegliata e non volevo che ti svegliavi :/\n\nE' 00:07 e non ci posso credere che sto leggendo la bibbia mentre sono in videochiamata con te che dormi.\n\nE' 00:37 non voglio chiudere la chiamata e andare a dormire, ti vorrei lasciare dormire così nel chill mentre ti sento. (siamo a 8 ore e 23 di chiamata)\n\nE' mezzanotte e 47 e il tempo sta passando MOLTO LENTAMENTE, vorrei essere con te a dormire in questo momento... mi sto per addormentare ma provo a rimanere sveglio.\n\nE' 00:55 e ti sei svegliata credo, hai spostato il telefono e boh... idk cosa sta succedendo.\n\nSono le 1am precise e credo che aspetterò ANCORA E ANCORA finchè non ti sveglierai... ti amo. \n\nson le 1:3             }
        ];

        const container = document.getElementById('letters-container');

        myLetters.forEach(letter => {
            const outerWrapper = document.createElement('div');
            outerWrapper.style.position = 'relative';

            const wrapper = document.createElement('div');
            wrapper.className = 'envelope-wrapper';
            
            wrapper.innerHTML = `
                <div class="flap"></div>
                <div class="heart-seal"></div>
                <div class="letter-preview-card">
                    <h4>${letter.title}</h4>
                </div>
                <div class="envelope"></div>
            `;

            const label = document.createElement('div');
            label.className = 'envelope-label';
            label.innerText = letter.date;
            outerWrapper.appendChild(wrapper);
            outerWrapper.appendChild(label);

            wrapper.onclick = () => {
                wrapper.classList.add('open');
                setTimeout(() => {
                    openModal(letter);
                }, 600);
            };

            container.appendChild(outerWrapper);
        });

        function openModal(letter) {
            document.getElementById('modal-date').innerText = letter.date;
            document.getElementById('modal-title').innerText = letter.title;
            document.getElementById('modal-body').innerText = letter.text;
            
            const modal = document.getElementById('letter-modal');
            modal.classList.add('active');
            
            document.querySelector('.modal-content').scrollTop = 0;
        }

        function closeModal() {
            const modal = document.getElementById('letter-modal');
            modal.classList.remove('active');
            
            const allEnvelopes = document.querySelectorAll('.envelope-wrapper');
            allEnvelopes.forEach(env => env.classList.remove('open'));
        }

        // --- SFONDO ANIMATO ---
        const canvas = document.getElementById('canvas-particles');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = Math.random() * 0.2 - 0.1;
                this.speedY = Math.random() * -0.3 - 0.1;
                this.opacity = Math.random() * 0.5 + 0.2;
                this.fadeRate = Math.random() * 0.003 + 0.001;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.opacity -= this.fadeRate;
                if (this.opacity <= 0 || this.y < 0) {
                    this.x = Math.random() * canvas.width;
                    this.y = canvas.height + 10;
                    this.opacity = Math.random() * 0.6 + 0.2;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 182, 193, ${this.opacity})`;
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#ff7597';
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        for (let i = 0; i < 50; i++) { particles.push(new Particle()); }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
