<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M12ANO 💜</title>
    <!-- ICONA DEL SITO (Cerca il file favicon.ico nella cartella principale) -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        /* --- DESIGN PROFESSIONALE VIOLA --- */
        :root {
            --bg-gradient: linear-gradient(135deg, #0f081d, #1a0b2e);
            --panel-bg: rgba(255, 255, 255, 0.04);
            --panel-border: rgba(157, 78, 221, 0.2);
            --text-main: #f3e8ff;
            --text-muted: #9d4edd;
            --accent-neon: #e0aaff;
            --accent-purple: #7b2cbf;
            --btn-hover: #9d4edd;
            --heart-color: #9d4edd;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            text-align: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            letter-spacing: -0.3px;
            overflow-x: hidden;
            position: relative;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-top: 20px;
            margin-bottom: 5px;
            background: linear-gradient(45deg, #e0aaff, #9d4edd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            z-index: 10;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #c77dff;
            margin-bottom: 15px;
            opacity: 0.8;
            z-index: 10;
        }

        /* --- PULSANTE AUDIO MUTE --- */
        .audio-control-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: all 0.2s ease;
            margin-bottom: 20px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .audio-control-btn:hover {
            background: rgba(157, 78, 221, 0.2);
            border-color: var(--accent-neon);
            box-shadow: 0 0 10px rgba(157, 78, 221, 0.3);
        }

        /* --- DISPLAY PUNTEGGI & LIVELLI --- */
        .counter-container {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 20px 40px;
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            margin-bottom: 20px;
            min-width: 260px;
            z-index: 10;
        }

        #score {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--text-main);
            display: block;
            line-height: 1;
            margin-bottom: 8px;
            text-shadow: 0 0 20px rgba(157, 78, 221, 0.4);
        }

        #pps-display {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 15px;
            display: block;
        }

        .level-section {
            border-top: 1px solid rgba(157, 78, 221, 0.2);
            padding-top: 12px;
            margin-top: 10px;
        }

        #level-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--accent-neon);
            margin-bottom: 6px;
            display: block;
        }

        .progress-bar-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            height: 8px;
            width: 100%;
            overflow: hidden;
            border: 1px solid rgba(157, 78, 221, 0.1);
        }

        #progress-bar {
            background: linear-gradient(90deg, #7b2cbf, #e0aaff);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px rgba(224, 170, 255, 0.5);
        }

        /* --- CUORE VIOLA ANIMATO --- */
        .clicker-container {
            margin: 50px 0;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .heart {
            background-color: var(--heart-color);
            display: inline-block;
            height: 100px;
            position: relative;
            transform: rotate(-45deg);
            width: 100px;
            cursor: pointer;
            animation: pulse 1.4s infinite cubic-bezier(0.215, 0.610, 0.355, 1);
            filter: drop-shadow(0 0 25px rgba(157, 78, 221, 0.6));
            transition: transform 0.05s ease;
        }

        .heart:before, .heart:after {
            content: "";
            background-color: var(--heart-color);
            border-radius: 50%;
            height: 100px;
            position: absolute;
            width: 100px;
        }
        .heart:before { top: -50px; left: 0; }
        .heart:after { top: 0; left: 50px; }
        .heart:active {
            animation: none;
            transform: rotate(-45deg) scale(0.85);
        }

        @keyframes pulse {
            0% { transform: rotate(-45deg) scale(0.95); }
            40% { transform: rotate(-45deg) scale(1.1); }
            60% { transform: rotate(-45deg) scale(1.02); }
            80% { transform: rotate(-45deg) scale(1.15); }
            100% { transform: rotate(-45deg) scale(0.95); }
        }

        /* --- CONTENITORE BACKGROUND CUORI --- */
        #bg-hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .ambient-heart {
            position: absolute;
            color: rgba(157, 78, 221, 0.35);
            font-size: 1.2rem;
            bottom: -20px;
            animation: floatBackground linear infinite;
            filter: drop-shadow(0 0 5px rgba(157, 78, 221, 0.2));
        }

        @keyframes floatBackground {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% {
                transform: translateY(-105vh) translateX(var(--random-x, 20px)) rotate(var(--random-rot, 360deg));
                opacity: 0;
            }
        }

        /* --- STILE NUMERI FLUTTUANTI AL CLICK E SBLOCCHI --- */
        .floating-number {
            position: fixed;
            color: var(--accent-neon);
            font-size: 1.4rem;
            font-weight: 800;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(224, 170, 255, 0.8);
            animation: floatUp 0.8s ease-out forwards;
            z-index: 9999;
        }

        .floating-number.reward-style {
            color: #ffb7ff;
            font-size: 1.6rem;
            text-shadow: 0 0 15px rgba(255, 183, 255, 0.9);
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.2); }
        }

        /* --- INTERFACCIA MENU A TENDINA --- */
        .menu-container {
            width: 100%;
            max-width: 450px;
            margin-top: 15px;
            z-index: 10;
        }

        .dropdown-menu {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            margin-bottom: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .menu-trigger {
            width: 100%;
            background: none;
            border: none;
            color: var(--text-main);
            padding: 16px 20px;
            font-size: 1.05rem;
            font-weight: 600;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            margin: 0;
        }

        .menu-trigger:hover { background: rgba(157, 78, 221, 0.08); }
        .menu-trigger::after {
            content: '▼';
            font-size: 0.75rem;
            color: var(--text-muted);
            transition: transform 0.3s ease;
        }

        .dropdown-menu.active .menu-trigger::after { transform: rotate(180deg); }

        .menu-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            padding: 0 20px;
            background: rgba(0, 0, 0, 0.15);
        }

        .game-btn {
            background: rgba(123, 44, 191, 0.3);
            border: 1px solid rgba(157, 78, 221, 0.4);
            color: var(--text-main);
            padding: 14px 16px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-bottom: 12px;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: all 0.2s ease;
        }

        .game-btn:first-child { margin-top: 15px; }

        .game-btn:hover:not(:disabled) {
            background: var(--btn-hover);
            border-color: var(--accent-neon);
            box-shadow: 0 0 15px rgba(157, 78, 221, 0.4);
        }

        .game-btn:disabled {
            background: rgba(255, 255, 255, 0.02);
            border-color: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.2);
            cursor: not-allowed;
        }

        .btn-title { font-size: 0.95rem; }
        .price { font-size: 0.75rem; color: var(--accent-neon); font-weight: 400; }
        .game-btn:disabled .price { color: rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body>

    <!-- TRACCIA AUDIO IN LOOP (Cerca il file audio.mp3 nella cartella principale) -->
    <audio id="bg-music" src="audio.mp3" loop></audio>

    <div id="bg-hearts-container"></div>

    <h1>M12ANO 💜</h1>
    <div class="subtitle">Accumula punti e sblocca premi reali</div>

    <!-- BOTTONE PER DISABILITARE/ABILITARE MUSICA -->
    <button id="audio-toggle" class="audio-control-btn" onclick="toggleMusicAudio()">
        <span id="audio-icon">🔇</span> <span id="audio-text">Audio Off</span>
    </button>

    <div class="counter-container">
        <span id="score">0</span>
        <span id="pps-display">Punti al secondo: 0</span>
        
        <div class="level-section">
            <span id="level-title">Livello 1: Primi Sguardi 👀</span>
            <div class="progress-bar-container">
                <div id="progress-bar"></div>
            </div>
        </div>
    </div>

    <div class="clicker-container">
        <div class="heart" id="main-button" onclick="clickMainButton(event)"></div>
    </div>

    <div class="menu-container">
        <!-- TENDINA POTENZIAMENTI -->
        <div class="dropdown-menu" id="menu-upgrades">
            <button class="menu-trigger" onclick="toggleMenu('menu-upgrades')">Potenziamenti</button>
            <div class="menu-content">
                <button id="click_up" class="game-btn" onclick="buyClickUpgrade()">
                    <span class="btn-title">Sguardo Intenso 👀 (Potenza Click)</span>
                    <span class="price">Costa: 25 | (+1 per Click)</span>
                </button>
                <button id="up1" class="game-btn" onclick="buyUpgrade('up1', 50, 1)">
                    <span class="btn-title">Pensiero Fisso 💭</span>
                    <span class="price">Costa: 50 | (+1 P/s)</span>
                </button>
                <button id="up2" class="game-btn" onclick="buyUpgrade('up2', 500, 10)">
                    <span class="btn-title">Battito Accelerato 💜</span>
                    <span class="price">Costa: 500 | (+10 P/s)</span>
                </button>
                <button id="up3" class="game-btn" onclick="buyUpgrade('up3', 2500, 50)">
                    <span class="btn-title">Sintonia Mentale 🧠</span>
                    <span class="price">Costa: 2.500 | (+50 P/s)</span>
                </button>
                <button id="up4" class="game-btn" onclick="buyUpgrade('up4', 15000, 400)">
                    <span class="btn-title">Intesa Perfetta 🔮</span>
                    <span class="price">Costa: 15.000 | (+400 P/s)</span>
                </button>
            </div>
        </div>

        <!-- TENDINA PREMI REALI -->
        <div class="dropdown-menu" id="menu-rewards">
            <button class="menu-trigger" onclick="toggleMenu('menu-rewards')">Riscatta Premi</button>
            <div class="menu-content">
                <button id="premio1" class="game-btn" onclick="claimReward('premio1', 1000, 'Abbraccio 🤗')">
                    <span class="btn-title">Abbraccio</span>
                    <span class="price">Costa: 1.000</span>
                </button>
                <button id="premio2" class="game-btn" onclick="claimReward('premio2', 10000, 'Ascoltiamo Nayt insieme 🎧')">
                    <span class="btn-title">Ascoltiamo Nayt insieme</span>
                    <span class="price">Costa: 10.000</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        /* --- LOGICA DI GIOCO --- */

        let score = parseFloat(localStorage.getItem('clicker_score')) || 0;
        let pps = parseFloat(localStorage.getItem('clicker_pps')) || 0;
        let totalScoreEarned = parseFloat(localStorage.getItem('clicker_total_earned')) || 0;
        let clickPower = parseInt(localStorage.getItem('clicker_click_power')) || 1;
        
        let upgrades = JSON.parse(localStorage.getItem('clicker_upgrades')) || { up1: 0, up2: 0, up3: 0, up4: 0, click_up: 0 };
        let rewardsClaimed = JSON.parse(localStorage.getItem('clicker_rewards_claimed')) || { premio1: 0, premio2: 0 };
        
        // Stato audio (salvato anche in local storage)
        let isMusicMuted = localStorage.getItem('clicker_music_muted') === 'true';

        const levelTitles = [
            "Primi Sguardi 👀",
            "Spotted Vda ✨",
            "stessi pensieri 💬",
            "BFF 💭",
            "Vite simili 💜",
            "Legame Speciale 🔐",
            "Custode del mio Cuore 🏆"
        ];

        initAmbientHearts();
        updateUI();
        updateAudioButtonUI();

        // Gestione e inizializzazione Audio
        function initMusic() {
            const music = document.getElementById('bg-music');
            if (!isMusicMuted) {
                music.play().catch(err => {
                    console.log("In attesa di interazione utente per avviare l'audio.");
                });
            }
        }

        // Tenta di avviare al primo click sulla pagina
        document.body.addEventListener('click', initMusic, { once: true });

        function toggleMusicAudio() {
            const music = document.getElementById('bg-music');
            isMusicMuted = !isMusicMuted;
            localStorage.setItem('clicker_music_muted', isMusicMuted);

            if (isMusicMuted) {
                music.pause();
            } else {
                music.play().catch(err => console.log("Riproduzione ripresa dopo interazione."));
            }
            updateAudioButtonUI();
        }

        function updateAudioButtonUI() {
            const icon = document.getElementById('audio-icon');
            const text = document.getElementById('audio-text');
            if (isMusicMuted) {
                icon.innerText = '🔇';
                text.innerText = 'Audio Spento';
            } else {
                icon.innerText = '🔊';
                text.innerText = 'Audio Acceso';
            }
        }

        function toggleMenu(menuId) {
            const menu = document.getElementById(menuId);
            const content = menu.querySelector('.menu-content');
            
            document.querySelectorAll('.dropdown-menu').forEach(item => {
                if(item.id !== menuId) {
                    item.classList.remove('active');
                    item.querySelector('.menu-content').style.maxHeight = null;
                }
            });

            menu.classList.toggle('active');
            if (menu.classList.contains('active')) {
                content.style.maxHeight = content.scrollHeight + "px";
            } else {
                content.style.maxHeight = null;
            }
        }

        function clickMainButton(e) {
            score += clickPower;
            totalScoreEarned += clickPower;
            
            createFloatingNumber(e, `+${clickPower}`, false);
            updateUI();
            saveGame();
        }

        function createFloatingNumber(e, text, isReward = false) {
            const floating = document.createElement('div');
            floating.className = 'floating-number' + (isReward ? ' reward-style' : '');
            floating.innerText = text;

            let x, y;
            if (e && e.clientX) {
                x = e.clientX;
                y = e.clientY;
            } else {
                const rect = document.getElementById('main-button').getBoundingClientRect();
                x = rect.left + rect.width / 2;
                y = rect.top + rect.height / 2;
            }

            floating.style.left = `${x - 15}px`;
            floating.style.top = `${y - 15}px`;

            document.body.appendChild(floating);
            setTimeout(() => { floating.remove(); }, 800);
        }

        function buyClickUpgrade() {
            let currentCost = Math.round(25 * Math.pow(1.25, upgrades['click_up'] || 0));

            if (score >= currentCost) {
                score -= currentCost;
                upgrades['click_up'] = (upgrades['click_up'] || 0) + 1;
                clickPower += 1;
                
                updateUI();
                saveGame();
                
                const activeMenu = document.querySelector('.dropdown-menu.active .menu-content');
                if(activeMenu) activeMenu.style.maxHeight = activeMenu.scrollHeight + "px";
            }
        }

        function buyUpgrade(id, baseCost, ppsValue) {
            let currentCost = Math.round(baseCost * Math.pow(1.15, upgrades[id] || 0));

            if (score >= currentCost) {
                score -= currentCost;
                upgrades[id] = (upgrades[id] || 0) + 1;
                pps += ppsValue;
                
                updateUI();
                saveGame();
                
                const activeMenu = document.querySelector('.dropdown-menu.active .menu-content');
                if(activeMenu) activeMenu.style.maxHeight = activeMenu.scrollHeight + "px";
            }
        }

        function claimReward(id, cost, rewardName) {
            if (score >= cost) {
                score -= cost;
                rewardsClaimed[id] = (rewardsClaimed[id] || 0) + 1;
                
                createFloatingNumber(null, `Sbloccato! 💜`, true);
                
                updateUI();
                saveGame();
            }
        }

        function initAmbientHearts() {
            setInterval(() => {
                let totalUpgrades = (upgrades['up1'] || 0) + (upgrades['up2'] || 0) + 
                                    (upgrades['up3'] || 0) + (upgrades['up4'] || 0) + 
                                    (upgrades['click_up'] || 0) + (rewardsClaimed['premio1'] || 0) + 
                                    (rewardsClaimed['premio2'] || 0);
                                    
                if (totalUpgrades === 0) return;

                let spawnAmount = Math.min(Math.ceil(totalUpgrades / 3), 4);
                for (let i = 0; i < spawnAmount; i++) {
                    createAmbientHeart();
                }
            }, 1200);
        }

        function createAmbientHeart() {
            const container = document.getElementById('bg-hearts-container');
            if (container.childElementCount > 40) return; 

            const heart = document.createElement('div');
            heart.className = 'ambient-heart';
            heart.innerHTML = '💜';

            heart.style.left = Math.random() * 100 + 'vw';
            let size = (Math.random() * 14) + 10;
            heart.style.fontSize = size + 'px';

            heart.style.setProperty('--random-x', (Math.random() * 80 - 40) + 'px');
            heart.style.setProperty('--random-rot', (Math.random() * 180 + 90) + 'deg');

            let duration = (Math.random() * 4) + 4;
            heart.style.animationDuration = duration + 's';

            container.appendChild(heart);
            setTimeout(() => { heart.remove(); }, duration * 1000);
        }

        // Loop Punti al Secondo
        setInterval(function() {
            if (pps > 0) {
                let ppsFraction = pps / 10;
                score += ppsFraction;
                totalScoreEarned += ppsFraction;
                updateUI();
            }
        }, 100);

        setInterval(saveGame, 5000);

        function updateUI() {
            document.getElementById('score').innerText = Math.floor(score).toLocaleString('it-IT');
            document.getElementById('pps-display').innerText = `Punti al secondo: ${pps.toFixed(1)}`;

            let currentLevel = Math.floor(Math.log(totalScoreEarned / 100 + 1) / Math.log(2.5)) + 1;
            if (currentLevel < 1) currentLevel = 1;

            let pointsForCurrentLevel = 100 * (Math.pow(2.5, currentLevel - 1) - 1);
            let pointsForNextLevel = 100 * (Math.pow(2.5, currentLevel) - 1);
            
            let levelProgress = ((totalScoreEarned - pointsForCurrentLevel) / (pointsForNextLevel - pointsForCurrentLevel)) * 100;
            if(levelProgress > 100) levelProgress = 100;
            if(levelProgress < 0) levelProgress = 0;

            let titleText = levelTitles[currentLevel - 1] || "Linked forever ♾️";
            document.getElementById('level-title').innerText = `Livello ${currentLevel}: ${titleText}`;
            document.getElementById('progress-bar').style.width = `${levelProgress}%`;

            // UI Potenziamenti
            let costClickUp = Math.round(25 * Math.pow(1.25, upgrades['click_up'] || 0));
            document.getElementById('click_up').querySelector('.price').innerText = `Costa: ${costClickUp} | (+1/Click) [Liv: ${upgrades['click_up'] || 0} (Valore click: +${clickPower})]`;
            document.getElementById('click_up').disabled = (score < costClickUp);

            let costUp1 = Math.round(50 * Math.pow(1.15, upgrades['up1'] || 0));
            document.getElementById('up1').querySelector('.price').innerText = `Costa: ${costUp1} | (+1 P/s) [Posseduti: ${upgrades['up1'] || 0}]`;
            document.getElementById('up1').disabled = (score < costUp1);

            let costUp2 = Math.round(500 * Math.pow(1.15, upgrades['up2'] || 0));
            document.getElementById('up2').querySelector('.price').innerText = `Costa: ${costUp2} | (+10 P/s) [Posseduti: ${upgrades['up2'] || 0}]`;
            document.getElementById('up2').disabled = (score < costUp2);

            let costUp3 = Math.round(2500 * Math.pow(1.15, upgrades['up3'] || 0));
            document.getElementById('up3').querySelector('.price').innerText = `Costa: ${costUp3} | (+50 P/s) [Posseduti: ${upgrades['up3'] || 0}]`;
            document.getElementById('up3').disabled = (score < costUp3);

            let costUp4 = Math.round(15000 * Math.pow(1.15, upgrades['up4'] || 0));
            document.getElementById('up4').querySelector('.price').innerText = `Costa: ${costUp4} | (+400 P/s) [Posseduti: ${upgrades['up4'] || 0}]`;
            document.getElementById('up4').disabled = (score < costUp4);

            // UI Premi Reali
            document.getElementById('premio1').querySelector('.price').innerText = `Costa: 1.000 | [Riscattati: ${rewardsClaimed['premio1'] || 0}]`;
            document.getElementById('premio1').disabled = (score < 1000);

            document.getElementById('premio2').querySelector('.price').innerText = `Costa: 10.000 | [Riscattati: ${rewardsClaimed['premio2'] || 0}]`;
            document.getElementById('premio2').disabled = (score < 10000);
        }

        function saveGame() {
            localStorage.setItem('clicker_score', score);
            localStorage.setItem('clicker_pps', pps);
            localStorage.setItem('clicker_total_earned', totalScoreEarned);
            localStorage.setItem('clicker_click_power', clickPower);
            localStorage.setItem('clicker_upgrades', JSON.stringify(upgrades));
            localStorage.setItem('clicker_rewards_claimed', JSON.stringify(rewardsClaimed));
        }
    </script>
</body>
</html>
